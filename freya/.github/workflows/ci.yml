# Freya CI.
#
# Activates once Freya is its own repository (a workflow in a subdirectory of
# another repo is not run by GitHub). Paths here assume the repo root IS the
# Freya project root (post-extraction).
#
# What runs today (Phase 0, software-only): load + the §17 strict type/perf gate
# and the test suite, in every build profile. SBCL is the open CI reference;
# AllegroCL is the deployment target (ADR-0011) and is exercised in the release
# pipeline where a license is available. The GPU triangle + golden-image jobs
# arrive once the native (SDL3 + wgpu-native) bring-up lands.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: SBCL on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Cache Quicklisp + fasls
        uses: actions/cache@v4
        with:
          path: |
            ~/quicklisp
            ~/.cache/freya
          key: ql-${{ runner.os }}-${{ hashFiles('net.goenninger.freya.asd') }}

      - name: Install Quicklisp (if not cached)
        run: |
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -sSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install)'
          fi

      # §17 strict type/perf gate: zero non-style warnings in either profile.
      - name: Build — checked (strict)
        run: make checked
      - name: Build — release (strict)
        run: make release

      # Tests in every profile (checked / release / telemetry-enabled).
      - name: Test — checked
        run: make test
      - name: Test — release
        run: make release-test
      - name: Test — telemetry enabled
        run: make telemetry-test

      # TODO (native bring-up): install pinned wgpu-native + SDL3 (+ lavapipe on
      # Linux) and run the triangle smoke + headless golden-image suite.
